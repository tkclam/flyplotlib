[project]
name = "flyplotlib"
version = "0.5.2"
description = "Add flies to matplotlib plots."
readme = "README.md"
authors = [
    { name = "tkclam", email = "thomas.lam@epfl.ch" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "svgpath2mpl",
]
project-urls = { "Repository" = "https://github.com/tkclam/flyplotlib" }

[project.optional-dependencies]
examples = [
    "distinctipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel",
    "pre-commit",
]
