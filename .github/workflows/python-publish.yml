# Build and publish the package to PyPI when a GitHub release is published.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flyplotlib
    permissions:
      # Required for trusted publishing (OIDC): PyPI mints a short-lived token
      # from this identity, so no API token secret is needed.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always
